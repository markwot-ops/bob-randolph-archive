<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bob Randolph — El Tecolote Blanco</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  /* Landing-page-only overrides */
  html { scroll-behavior: smooth; }
  .hero { min-height: 100vh; }
  #what { scroll-margin-top: 1.5rem; }
  .hero-cta {
    cursor: pointer;
    background: var(--accent);
    color: #f8f2e6;
    font-size: 0.82rem;
    padding: 0.62em 1.25em;
    transition: background .15s ease, transform .1s ease;
  }
  .hero-cta:hover { background: var(--accent-soft); }
  .hero-cta:active { transform: translateY(1px); }
  .hero-cta .arrow { margin-left: 0.5em; }

  /* Intro light-sweep over the name + alias */
  .hero-copy { position: relative; overflow: hidden; }
  .hero-sweep {
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 45%; pointer-events: none; opacity: 0;
    background: linear-gradient(100deg,
      transparent 0%, rgba(255,255,255,0) 38%,
      rgba(255,255,255,0.92) 50%,
      rgba(255,255,255,0) 62%, transparent 100%);
    mix-blend-mode: screen;
    transform: translateX(-160%) skewX(-14deg);
  }
  .hero-copy.swept .hero-sweep {
    animation: heroSweep 1.15s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes heroSweep {
    0%   { transform: translateX(-160%) skewX(-14deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateX(260%) skewX(-14deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-copy.swept .hero-sweep { animation: none; }
  }
  .sound-toggle {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 60;
    background: var(--accent); color: #f8f2e6; border: none;
    border-radius: 999px; padding: 0.55em 1.05em; font-size: 0.82rem;
    cursor: pointer; opacity: 0.94; box-shadow: 0 2px 12px rgba(0,0,0,.35);
  }
  .sound-toggle:hover { background: var(--accent-soft); }

  /* ---- Home v2: one full-screen view; the right side dissolves to the archive statement ---- */
  html, body.home-page { height: 100%; }
  body.home-page { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background:#18130f; }
  body.home-page .masthead { flex: 0 0 auto; }
  .masthead--bar { border-bottom-width: 3px; }
  .hero-full { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .hero-full .hero-media { min-height: 0; height: 100%; }
  .hero-full .hero-copy { position: relative; overflow: hidden; padding: 0; display: block; }
  .pane {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
    padding: clamp(1.6rem, 5vw, 4rem) clamp(1.4rem, 5vw, 4rem);
    transition: opacity .95s ease, filter .95s ease, transform .95s ease, visibility 0s linear 0s;
  }
  .pane-b { justify-content: flex-start; overflow-y: auto; padding-top: clamp(1.4rem, 3vh, 2.4rem); padding-bottom: 4.5rem; opacity: 0; visibility: hidden; filter: blur(10px); transform: scale(.985);
            transition: opacity 1s ease .35s, filter 1s ease .35s, transform 1s ease .35s, visibility 0s linear 0s; scrollbar-width: thin; scrollbar-color: #6b4a3d #18130f; }
  .revealed .pane-a { opacity: 0; filter: blur(12px); transform: scale(1.03); pointer-events: none; visibility: hidden;
                      transition: opacity .95s ease, filter .95s ease, transform .95s ease, visibility 0s linear .95s; }
  .revealed .pane-b { opacity: 1; filter: none; transform: none; visibility: visible; }
  .pane-b .hero-name { font-size: clamp(2.2rem, 4.2vw, 3.6rem); line-height: .95; margin: 0 0 .35rem; border: 0; padding: 0; }
  .pane-b .hero-name .surname { display: inline; margin-left: .18em; }
  .pane-b .hero-alias { font-size: clamp(.95rem, 1.5vw, 1.1rem); margin: 0 0 1rem; }
  .pane-b .hero-kicker { margin-bottom: .6rem; }
  .reveal h2 { font-family: var(--serif); font-weight: normal; font-size: clamp(1.4rem, 2.1vw, 1.7rem); color: #f8f2e6; margin: 0 0 .4rem; border: 0; padding: 0; }
  .reveal h3 { font-family: var(--sans); font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: #d3a08a; margin: .95rem 0 .2rem; border: 0; padding: 0; }
  .reveal p { font-size: 1rem; line-height: 1.6; color: #e9dfc9; margin: 0 0 1rem; max-width: 42rem; }
  .reveal a { color: #e7b9a6; text-decoration: underline; text-underline-offset: 2px; }
  .reveal a:hover { color: #fff; }
  .reveal .credit { margin-top: 1.5rem; padding-top: .9rem; border-top: 1px solid rgba(233,223,201,.18); font-size: .88rem; font-style: italic; opacity: .8; }
  .reveal > * { opacity: 0; transform: translateY(12px); transition: opacity .7s ease, transform .7s ease; }
  .revealed .reveal > * { opacity: 1; transform: none; transition-delay: calc(.75s + var(--i, 0) * .11s); }
  .reveal-back { position: absolute; top: .9rem; right: 1.1rem; z-index: 3; background: transparent; border: 1px solid rgba(233,223,201,.3);
                 color: #e9dfc9; border-radius: 999px; padding: .3em .85em; font-family: var(--sans); font-size: .74rem; letter-spacing: .08em; cursor: pointer; opacity: .75; }
  .reveal-back:hover { opacity: 1; }

  /* Revealed state (desktop): on reveal, Bob glides up and to the left and settles a
     little smaller (and trimmed 7.5%/6.5%), opening the room the statement unfolds
     into — to his right, then beneath him — all on one screen. */
  @media (min-width: 721px) {
    /* Bob keeps his full-size column; on reveal he blows back out to full size with a
       quick rack-focus pull (defocus -> snap sharp) in the split second the statement
       lands in the right column. Script stays stable; no scroll. */
    .revealed .hero-media img { animation: bobRack .55s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes bobRack {
      0%   { transform: scale(1.09); filter: grayscale(1) contrast(1.12) brightness(.92) blur(7px); opacity: .5; }
      55%  { filter: grayscale(1) contrast(1.12) brightness(.92) blur(2.5px); }
      100% { transform: none; filter: grayscale(1) contrast(1.12) brightness(.92) blur(0); opacity: 1; }
    }
    .revealed .pane-b { overflow-y: auto;
      padding: clamp(1.2rem,3vh,2.4rem) clamp(1.4rem,4vw,3.4rem) clamp(1rem,2vh,1.6rem); }
    .revealed .reveal p, .revealed .reveal h2, .revealed .reveal h3 { max-width: none; }
    /* statement lands fast and stays stable */
    .revealed .reveal > * { transition-duration: .22s; transition-delay: calc(var(--i,0) * .03s); }
    .revealed .pane-b > .hero-kicker { margin-bottom: .3rem; }
    .revealed .pane-b > .hero-name { font-size: clamp(1.7rem,3vw,2.6rem); margin-bottom: .2rem; }
    .revealed .pane-b > .hero-alias { font-size: clamp(.9rem,1.3vw,1.1rem); margin-bottom: .6rem; }
    .revealed .reveal h2 { font-size: clamp(1.1rem,1.7vw,1.4rem); margin-bottom: .2rem; }
    .revealed .reveal h3 { margin: .55rem 0 .1rem; }
    .revealed .reveal p { font-size: 1rem; line-height: 1.6; margin-bottom: 1rem; }
    .revealed .reveal .credit { margin-top: .8rem; padding-top: .55rem; }
  }
  button.hero-cta { border: 0; font-family: var(--sans); }
  .sound-toggle { right: auto; left: 1rem; }
  @media (prefers-reduced-motion: reduce) { .pane, .pane-b, .reveal > * { transition-duration: .01s !important; transition-delay: 0s !important; } }
  /* Home v4: the cue opens a small motion window over the branding, which only shifts a little */
  #hero { position: relative; }
  .clip-window {
    position: absolute; z-index: 6; margin: 0;
    right: clamp(1.1rem, 4vw, 3.2rem); bottom: clamp(1.1rem, 5vh, 3.2rem);
    width: clamp(260px, 33vw, 460px); aspect-ratio: 16 / 9;
    background: #000; border: 1px solid rgba(233,223,201,.22); border-radius: 5px; overflow: hidden;
    box-shadow: 0 20px 55px rgba(0,0,0,.6);
    opacity: 0; transform: translateY(16px) scale(.98); pointer-events: none;
    transition: opacity .85s ease, transform .85s ease;
  }
  .playing .clip-window { opacity: 1; transform: none; pointer-events: auto; }
  .clip-window .clip-video { width: 100%; height: 100%; object-fit: cover; display: block;
    filter: grayscale(1) contrast(1.06) brightness(.98); }
  .clip-close {
    position: absolute; top: .3rem; right: .4rem; z-index: 2; width: 1.9em; height: 1.9em; line-height: 1;
    display: grid; place-items: center; border: 0; border-radius: 50%; cursor: pointer;
    background: rgba(24,19,15,.6); color: #f4ede0; font-size: 1.05rem; opacity: .8;
  }
  .clip-close:hover { opacity: 1; background: rgba(24,19,15,.85); }
  /* the big branding gives a little room when the clip is up, but stays dominant */
  .playing .pane-a { transition: transform .85s cubic-bezier(.4,0,.2,1); transform: translateY(-7%); }
  @media (max-width: 720px) {
    .clip-window { right: 50%; transform: translate(50%, 16px) scale(.98); bottom: clamp(.7rem, 2vh, 1.3rem);
      width: min(84vw, 400px); }
    .playing .clip-window { transform: translate(50%, 0); }
    .playing .pane-a { transform: none; }
    .playing .hero-media { height: 24vh !important; min-height: 0 !important; }
  }
  @media (max-width: 720px) {
    body.home-page { display: block; height: auto; overflow: auto; }
    .hero-full { min-height: calc(100dvh - 96px); grid-template-rows: auto auto; }
    .hero-full .hero-media { height: 42vh; min-height: 260px; }
    .hero-full .hero-copy { overflow: visible; }
    .pane { position: static; min-height: 46vh; }
    .pane-b { display: none; opacity: 1; visibility: visible; filter: none; transform: none; overflow: visible; }
    .revealed .pane-a { display: none; }
    .revealed .pane-b { display: flex; animation: paneIn .9s ease both; }
    @keyframes paneIn { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: none; } }
    .reveal-back { top: .6rem; }
  }
  .hero-prompt { font-family: var(--serif); font-style: italic; color: #e9dfc9;
    font-size: clamp(1.05rem, 1.9vw, 1.5rem); line-height: 1.35; margin: 0 0 1.5rem; max-width: 20em; }
  /* brilliant animated sparkle beside the Revolutionary Poet link */
  .cta-row { display: inline-flex; align-items: center; gap: .55em; }
  .sparkle { position: relative; display: inline-block; width: 2.1em; height: 2.1em;
    vertical-align: middle; flex: 0 0 auto; }
  /* pulsing halo of light behind the star */
  .halo { position: absolute; left: 50%; top: 50%; width: 2.1em; height: 2.1em;
    margin: -1.05em 0 0 -1.05em; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(255,236,170,.9) 0%, rgba(243,201,105,.45) 35%, rgba(243,201,105,0) 70%);
    animation: haloPulse 1.5s ease-in-out infinite; }
  @keyframes haloPulse {
    0%, 100% { transform: scale(.55); opacity: .35; }
    50%      { transform: scale(1.15); opacity: .95; }
  }
  .spark { position: absolute;
    background: radial-gradient(circle at 50% 50%, #fff 0%, #fff4cf 32%, #f3c969 62%, rgba(243,201,105,0) 100%);
    clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
    filter: drop-shadow(0 0 5px rgba(255,224,140,.95)) drop-shadow(0 0 11px rgba(243,201,105,.6)); }
  /* big central sparkle: spins fast and flares */
  .spark-main { width: 1.5em; height: 1.5em; left: 50%; top: 50%; margin: -0.75em 0 0 -0.75em;
    animation: sparkFlare .85s linear infinite; }
  @keyframes sparkFlare {
    0%   { transform: scale(.35) rotate(0deg);   opacity: .5; }
    45%  { transform: scale(1.25) rotate(140deg); opacity: 1; }
    70%  { transform: scale(.6) rotate(240deg);  opacity: .75; }
    100% { transform: scale(.35) rotate(360deg); opacity: .5; }
  }
  /* fast little glints that pop in and out around it */
  .glint { position: absolute; width: .55em; height: .55em;
    background: radial-gradient(circle at 50% 50%, #fff 0%, #fff4cf 45%, rgba(255,244,207,0) 75%);
    clip-path: polygon(50% 0%, 56% 44%, 100% 50%, 56% 56%, 50% 100%, 44% 56%, 0% 50%, 44% 44%);
    opacity: 0; transform: scale(0); filter: drop-shadow(0 0 4px rgba(255,235,170,.9)); }
  .glint.g1 { top: -6%; right: 0;   animation: pop 1.2s ease-in-out infinite;        animation-delay: .1s; }
  .glint.g2 { bottom: -4%; left: -2%; animation: pop 1.0s ease-in-out infinite;       animation-delay: .5s; }
  .glint.g3 { top: 40%;  right: -12%; width:.4em; height:.4em; animation: pop .8s ease-in-out infinite; animation-delay: .32s; }
  @keyframes pop {
    0%, 68%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
    80%           { opacity: 1; transform: scale(1) rotate(25deg); }
  }
</style>
</head>
<body class="home-page">

<header class="masthead masthead--bar">
  <nav class="site-nav">
    <a href="index.html" class="active">Home</a>
    <a href="about.html">About Bob</a>
    <a href="chapbooks/index.html">Chapbooks</a>
    <a href="books/index.html">Books</a>
    <a href="photography/index.html">Photography</a>
    <a href="readings/index.html">Taped Live Readings</a>
    <a href="master-index.html">Full Archive (1,775 poems)</a>
  </nav>
</header>
<section class="hero hero-full" id="hero">
  <div class="hero-media">
    <img src="assets/img/photography/bob.jpg" alt="Bob Randolph, mid-poem, reading aloud from a chapbook">
  </div>
  <div class="hero-copy">
    <div class="pane pane-a">
      <p class="hero-kicker">A Working Archive</p>
      <h1 class="hero-name">Bob<span class="surname">Randolph</span></h1>
      <p class="hero-alias">El Tecolote Blanco &mdash; the White Owl</p>
      <span class="cta-row"><button type="button" class="hero-role hero-cta" aria-controls="clipWindow" aria-expanded="false">Revolutionary Poet<span class="arrow" aria-hidden="true"> &rarr;</span></button><span class="sparkle" aria-hidden="true"><span class="spark spark-main"></span><span class="glint g1"></span><span class="glint g2"></span><span class="glint g3"></span></span></span>
    </div>

    <span class="hero-sweep" aria-hidden="true"></span>
  </div>

  <figure class="clip-window" id="clipWindow" aria-hidden="true">
    <video class="clip-video" id="clipVideo" playsinline preload="auto" poster="assets/img/walk-feature-poster.jpg">
      <source src="assets/video/walk-feature.mp4" type="video/mp4">
    </video>
    <button type="button" class="clip-close" id="clipClose" aria-label="Close clip">&times;</button>
  </figure>
</section>

<audio id="introAudio" preload="auto">
  <source src="assets/audio/sea-coast-intro.m4a" type="audio/mp4">
</audio>
<button type="button" class="sound-toggle" id="soundToggle" hidden>Pause audio</button>

<script>
(function () {
  var hero = document.getElementById('hero');
  var heroCopy = document.querySelector('.hero-copy');
  var cta = document.querySelector('.hero-cta');
  var back = document.querySelector('.reveal-back');
  var intro = document.getElementById('introAudio');
  var clip = document.getElementById('clipVideo');
  var win = document.getElementById('clipWindow');
  var closeBtn = document.getElementById('clipClose');
  var tog = document.getElementById('soundToggle');
  var audioCtx = null;
  var praiseStarted = false;
  function runSweep(){ if(!heroCopy) return; heroCopy.classList.remove('swept'); void heroCopy.offsetWidth; heroCopy.classList.add('swept'); }
  function swish(){ try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; if(!audioCtx) audioCtx=new AC(); if(audioCtx.state==='suspended') audioCtx.resume(); var t=audioCtx.currentTime,d=0.5; var o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(1500,t); o.frequency.exponentialRampToValueAtTime(220,t+d); var b=audioCtx.createBiquadFilter(); b.type='bandpass'; b.Q.value=0.9; b.frequency.setValueAtTime(1300,t); b.frequency.exponentialRampToValueAtTime(420,t+d); var g=audioCtx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.05); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(b); b.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+d+0.03); }catch(e){} }
  window.addEventListener('load', runSweep);

  // Audio arc over the clip's own natural sound: the nat sound ducks for the spoken
  // tribute (Bob on his own poetry), which fades in at ~43s and plays out, then the
  // nat sound comes back up. Timecodes sit in the clip's natural quiet stretch (36-48s).
  var DUCK_IN = 36, DUCK_FLOOR = 37.5, PRAISE_AT = 43, DUCK_OUT = 57, DUCK_UP = 59, FLOOR = 0.14;
  function updateArc() {
    if (!clip) return;
    var t = clip.currentTime, v = 1;
    if (t >= DUCK_IN && t < DUCK_FLOOR) v = 1 - (t - DUCK_IN) / (DUCK_FLOOR - DUCK_IN) * (1 - FLOOR);
    else if (t >= DUCK_FLOOR && t < DUCK_OUT) v = FLOOR;
    else if (t >= DUCK_OUT && t < DUCK_UP) v = FLOOR + (t - DUCK_OUT) / (DUCK_UP - DUCK_OUT) * (1 - FLOOR);
    clip.volume = v < 0 ? 0 : (v > 1 ? 1 : v);
    if (!praiseStarted && intro && t >= PRAISE_AT) {
      praiseStarted = true;
      try { intro.currentTime = 0; intro.volume = 1; var p = intro.play(); if (p && p.catch) p.catch(function(){}); } catch(e) {}
    }
  }
  function openClip(withSound) {
    hero.classList.add('playing');
    cta.setAttribute('aria-expanded', 'true');
    if (win) win.setAttribute('aria-hidden', 'false');
    runSweep(); swish();
    praiseStarted = false;
    if (clip) {
      try {
        clip.currentTime = 0; clip.muted = !withSound; clip.volume = 1;
        clip.addEventListener('timeupdate', updateArc);
        var pv = clip.play(); if (pv && pv.catch) pv.catch(function(){ try { clip.muted = true; clip.play(); } catch(e){} });
      } catch(e) {}
    }
    if (tog) { tog.hidden = false; tog.textContent = 'Pause'; }
  }
  function closeClip() {
    hero.classList.remove('playing');
    cta.setAttribute('aria-expanded', 'false');
    if (win) win.setAttribute('aria-hidden', 'true');
    if (clip) { try { clip.pause(); clip.removeEventListener('timeupdate', updateArc); clip.currentTime = 0; clip.volume = 1; } catch(e) {} }
    if (intro) { try { intro.pause(); intro.currentTime = 0; } catch(e) {} }
    praiseStarted = false;
    if (tog) { tog.hidden = true; }
    cta.focus({preventScroll:true});
  }
  if (cta) cta.addEventListener('click', function () { openClip(true); });
  if (closeBtn) closeBtn.addEventListener('click', closeClip);

  // when the clip ends, stop the tribute and offer a replay
  if (clip) clip.addEventListener('ended', function () { if (intro) { try { intro.pause(); } catch(e){} } if (tog) tog.textContent = 'Replay'; });

  if (tog) {
    tog.addEventListener('click', function () {
      if (!clip) return;
      if (clip.paused) {
        if (clip.ended) { praiseStarted = false; try { clip.currentTime = 0; } catch(e){} }
        try { clip.play(); } catch(e) {}
        if (intro && praiseStarted && !intro.ended) { try { intro.play(); } catch(e) {} }
        tog.textContent = 'Pause';
      } else {
        try { clip.pause(); } catch(e) {}
        if (intro) { try { intro.pause(); } catch(e) {} }
        tog.textContent = 'Play';
      }
    });
  }
  if (location.hash === '#clip' || location.hash === '#what') openClip(false);
})();
</script>

</body>
</html>
