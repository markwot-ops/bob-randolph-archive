<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zumi the Cockatoo — Bob Randolph</title>
<link rel="stylesheet" href="../../assets/book/reader.css">
</head>
<body>
<div id="book"></div>
<script src="../../assets/book/layouts.js"></script>
<script src="../../assets/book/reader.js"></script>
<script>
BookReader({
  root: document.getElementById('book'),
  layout: BookLayouts.flat,                /* plain chapbook: pages exactly as photographed */
  flat: true,
  spine: false,                            /* spiral-bound: the spiral is in the photographs */
  sounds: ['swish-1.wav','swish-2.wav'],     /* page-turn swish */
  base: '../../assets/book/',
  front: 'zumi-cover-scan.jpg',            /* cover photograph */
  back: 'zumi-back-scan.jpg',              /* back cover: the green inside-cover page (from the first spread), reused */
  sheet: function(k){ return 'sheets/s' + ('00' + k).slice(-3) + '.jpg'; },   /* two facing pages per image */
  total: 44,                               /* 22 photographed spreads = 44 pages */
  leftStart: 1,                            /* first spread = green inside cover | first poem */
  jump: [["Zumi the cockatoo", 1], ["The pelican and the seal", 2], ["Weeds", 2], ["Maui", 3], ["Russian Butterfly", 3], ["Birds Aloft", 4], ["Eddies", 5], ["Gray gull of long ago", 6], ["40 below", 7], ["Boundaries", 9], ["Burger King", 10], ["The coming of night", 11], ["Over to the right just a little", 11], ["Bordeaux wine", 12], ["Two Oaks", 13], ["Her children", 14], ["Harbin", 14], ["Woodpeckers overhead", 15], ["Little black moth", 16], ["Tales to tell", 16], ["A tiny creature", 17], ["Lorquin's Admiral", 17], ["Rain on the window", 18], ["Butterflies", 18], ["Digger pines and groceries", 19], ["Woodpecker holes", 19], ["Non-industrial society", 20], ["Little black cat", 20], ["Wiley", 21], ["The orange banker", 21], ["No straight lines", 22]],
  homeHref: '../../index.html',
  backHref: '../index.html',
  backLabel: 'Chapbooks',
  noArrows: true                           /* pages turn by clicking the page */
});
</script>
</body>
</html>
