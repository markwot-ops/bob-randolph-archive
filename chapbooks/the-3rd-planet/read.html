<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The 3rd Planet from the Sun Is in Flames — Bob Randolph</title>
<link rel="stylesheet" href="../../assets/book/reader.css">
</head>
<body>
<div id="book"></div>
<script src="../../assets/book/layouts.js"></script>
<script src="../../assets/book/reader.js"></script>
<script>
BookReader({
  root: document.getElementById('book'),
  layout: BookLayouts.flat,                /* plain chapbook: pages exactly as photographed */
  flat: true,
  spine: false,
  sounds: ['swish-1.wav','swish-2.wav'],   /* page-turn swish */
  base: '../../assets/book/',
  front: 'cover-3rd-planet.jpg',           /* cover photograph */
  sheet: function(k){ return 'sheets/s' + ('00' + k).slice(-3) + '.jpg'; },   /* two facing pages per image */
  total: 182,                              /* 91 photographed spreads (pages 140–141 missing, shown as a note card) */
  leftStart: 1,
  homeHref: '../../index.html',
  backHref: '../index.html',
  backLabel: 'Chapbooks',
  noArrows: true,                          /* pages turn by clicking the page */
  fastNav: true
});
</script>
</body>
</html>
