<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Picture of Dorian America — the book</title>
<link rel="stylesheet" href="../../assets/book/reader.css">
</head>
<body>
<div id="book"></div>
<script src="../../assets/book/layouts.js"></script>
<script src="../../assets/book/reader.js"></script>
<script>
BookReader({
  root: document.getElementById('book'),
  layout: BookLayouts.landscape,          /* landscape open-book frame (pages are 11 x 8.5) */
  base: '../../assets/book/',
  front: 'cover-front.jpg',               /* closed leather cover, spine left */
  back: 'cover-back.jpg',                 /* closed leather back cover, spine right */
  /* first spread = 'First Edition' page | the girl and 'The end of the world?' page, both on paper;
     the old grey inside cover and its blank pages are skipped, so every later page is shifted by two files */
  page: function(n){
    var f = (n === 2) ? 4 : (n === 3) ? 3 : n + 2;
    return 'pages/p' + ('00' + f).slice(-3) + '.jpg';
  },
  total: 195,                             /* last page = blank paper (file p197) */
  leftStart: 2,                           /* first spread = pp. 2-3 */
  homeHref: '../../index.html',
  backHref: '../../books/index.html',
  backLabel: 'Books'
});
</script>
</body>
</html>
