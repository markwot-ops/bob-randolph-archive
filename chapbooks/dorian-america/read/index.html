<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Picture of Dorian America — read the book — Bob Randolph</title>
<link rel="stylesheet" href="../../../assets/css/app.css">
<style>
  html,body { height:100%; }
  body.reader { margin:0; background:#141210; }
  .reader-bar {
    display:flex; align-items:center; gap:.55rem; flex-wrap:wrap;
    padding:.5rem .9rem; background:#000; color:#f4ece0;
    position:sticky; top:0; z-index:10; font-size:.9rem;
  }
  .reader-bar a { color:#f4ece0; text-decoration:none; opacity:.85; }
  .reader-bar a:hover { opacity:1; }
  .reader-bar .sp { flex:1; }
  .rbtn { background:transparent; border:1px solid rgba(255,255,255,.35); color:#f4ece0;
    border-radius:4px; padding:.3em .7em; cursor:pointer; font-size:1rem; line-height:1; }
  .rbtn:hover { background:rgba(255,255,255,.12); }
  .rbtn:disabled { opacity:.3; cursor:default; }
  .rbtn.active { background:rgba(255,255,255,.18); }
  #label { min-width:7em; text-align:center; opacity:.9; }
  .stage { height:calc(100vh - 50px); display:flex; align-items:center; justify-content:center;
    overflow:auto; padding:1.2rem; box-sizing:border-box; }
  .book { display:flex; align-items:stretch; justify-content:center;
    max-width:100%; max-height:100%; box-shadow:0 10px 40px rgba(0,0,0,.6); background:#fff; }
  .book.single { box-shadow:0 12px 44px rgba(0,0,0,.65); }
  .leaf { display:flex; align-items:center; justify-content:center; background:#fff; }
  .leaf img { display:block; max-width:100%; max-height:calc(100vh - 96px); object-fit:contain; }
  .book.spread .leaf.left  { box-shadow: inset -14px 0 22px -14px rgba(0,0,0,.45); }
  .book.spread .leaf.right { box-shadow: inset  14px 0 22px -14px rgba(0,0,0,.45); }
  .book.zoom .leaf img { max-height:none; max-width:none; height:1150px; }
  .book.zoom { max-width:none; max-height:none; }
  .stage.zoomon { align-items:flex-start; justify-content:flex-start; }
  .leaf.blank { background:#efe9dd; }
  .turnzone { display:none; }
  .hint { color:#8a8378; font-size:.78rem; }
</style>
</head>
<body class="reader">

<div class="reader-bar">
  <a href="../index.html">&larr; The Picture of Dorian America</a>
  <span class="sp"></span>
  <button class="rbtn" id="prev" aria-label="Previous">&lsaquo;</button>
  <span id="label">Cover</span>
  <button class="rbtn" id="next" aria-label="Next">&rsaquo;</button>
  <button class="rbtn" id="zoom" aria-label="Zoom" title="Zoom">&#9906;</button>
  <span class="sp"></span>
  <span class="hint">click a page to turn &middot; &larr; &rarr; keys</span>
</div>

<div class="stage" id="stage">
  <div class="book" id="book"></div>
</div>

<script>
(function(){
  var TOTAL = 197;
  var base = "../pages/";
  function pad(n){ return String(n).padStart(3,"0"); }
  function src(n){ return base + "p" + pad(n) + ".jpg"; }

  // Build views: front cover (single), interior spreads, back cover (single)
  var views = [];
  views.push({single:true, L:1});                 // front cover
  for (var i=2; i<=196; i+=2){                     // interior spreads
    views.push({single:false, L:i, R:(i+1<=196? i+1 : null)});
  }
  views.push({single:true, L:197});               // back cover
  var LAST = views.length-1;

  var cur = 0, zoom = false;
  var book = document.getElementById("book");
  var stage = document.getElementById("stage");
  var label = document.getElementById("label");
  var prev = document.getElementById("prev"), next = document.getElementById("next");
  var zbtn = document.getElementById("zoom");

  function leaf(n, side, blank){
    if (blank) return '<div class="leaf blank ' + side + '"></div>';
    return '<div class="leaf ' + side + '"><img src="' + src(n) + '" alt="Page ' + n + '" draggable="false"></div>';
  }
  function preload(n){ if(n>=1&&n<=TOTAL){ var im=new Image(); im.src=src(n); } }

  function render(){
    var v = views[cur];
    book.className = "book" + (v.single ? " single" : " spread") + (zoom ? " zoom" : "");
    if (v.single){
      book.innerHTML = leaf(v.L, "only");
      label.textContent = (cur===0 ? "Cover" : "Back cover");
    } else {
      book.innerHTML = leaf(v.L, "left") + (v.R ? leaf(v.R, "right") : leaf(null,"right",true));
      label.textContent = "Pages " + v.L + (v.R ? "\u2013" + v.R : "");
    }
    prev.disabled = (cur===0); next.disabled = (cur===LAST);
    // preload neighbours
    var nx = views[cur+1], pv = views[cur-1];
    if(nx){ preload(nx.L); if(nx.R) preload(nx.R); }
    if(pv){ preload(pv.L); if(pv.R) preload(pv.R); }
    try{ location.hash = cur; }catch(e){}
    if(zoom) stage.scrollLeft=0, stage.scrollTop=0;
  }
  function go(d){ cur = Math.max(0, Math.min(LAST, cur+d)); zoom=false; stage.classList.remove("zoomon"); zbtn.classList.remove("active"); render(); }

  prev.onclick = function(){ go(-1); };
  next.onclick = function(){ go(1); };
  zbtn.onclick = function(){ zoom=!zoom; zbtn.classList.toggle("active", zoom); stage.classList.toggle("zoomon", zoom); render(); };

  // click left/right half of the book to turn (when not zoomed)
  book.addEventListener("click", function(e){
    if(zoom) return;
    var r = book.getBoundingClientRect();
    if (e.clientX < r.left + r.width/2) go(-1); else go(1);
  });

  document.addEventListener("keydown", function(e){
    if(e.key==="ArrowRight"||e.key==="PageDown"){ go(1); }
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(-1); }
  });
  // swipe
  var x0=null;
  stage.addEventListener("touchstart", function(e){ if(!zoom) x0=e.touches[0].clientX; }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if(x0===null) return; var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>45){ go(dx<0?1:-1); } x0=null;
  }, {passive:true});

  var start = parseInt((location.hash||"").replace("#",""),10);
  cur = (!isNaN(start) && start>=0 && start<=LAST) ? start : 0;
  render();
})();
</script>
</body>
</html>
