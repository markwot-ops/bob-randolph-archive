<style>
  .gallery-controls { display: flex; align-items: center; gap: 0.6rem; margin: 0 0 1.5rem; flex-wrap: wrap; }
  .gallery-controls .lbl { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; }
  .gallery-controls input[type=range] { flex: 1 1 160px; max-width: 240px; accent-color: var(--accent); }
  .zoom-btn { border: 1px solid rgba(0,0,0,0.2); background: transparent; color: inherit; width: 2rem; height: 2rem; border-radius: 4px; font-size: 1.1rem; line-height: 1; cursor: pointer; }
  .zoom-btn:hover { background: rgba(0,0,0,0.06); }
  .video-gallery { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 1.25rem; }
  .vid-card { margin: 0; }
  .vid-card video { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; border-radius: 4px; }
  .vid-card h3 { font-size: 0.98rem; margin: 0.5rem 0 0; font-weight: 600; }
</style>

<script>
  (function () {
    var gallery = document.getElementById('gallery');
    var range = document.getElementById('zoomRange');
    var out = document.getElementById('zoomOut');
    var zin = document.getElementById('zoomIn');
    var MINZ = 1, MAXZ = 4;
    // higher zoom = bigger videos (fewer columns); slider right = bigger
    function apply(zoom) {
      zoom = Math.max(MINZ, Math.min(MAXZ, zoom));
      gallery.style.setProperty('--cols', (MINZ + MAXZ) - zoom);
      range.value = zoom;
    }
    var startCols = window.innerWidth <= 640 ? 1 : (window.innerWidth <= 980 ? 2 : 3);
    apply((MINZ + MAXZ) - startCols);
    range.addEventListener('input', function () { apply(parseInt(range.value, 10)); });
    zin.addEventListener('click', function () { apply(parseInt(range.value, 10) + 1); });
    out.addEventListener('click', function () { apply(parseInt(range.value, 10) - 1); });
  })();
</script>
